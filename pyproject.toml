[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "httpx-proxyhat"
version = "0.1.0"
description = "ProxyHat residential proxies for httpx — drop-in sync/async clients with sticky sessions, geo-targeting and rotation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ProxyHat", email = "support@proxyhat.com" }]
keywords = [
    "httpx",
    "proxy",
    "residential-proxy",
    "proxyhat",
    "async",
    "http-client",
    "sticky-session",
    "rotating-proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = ["proxyhat>=0.2.0", "httpx>=0.26"]

[project.urls]
Homepage = "https://proxyhat.com"
Documentation = "https://docs.proxyhat.com"
Repository = "https://github.com/ProxyHatCom/httpx-proxyhat"

[project.optional-dependencies]
socks = ["httpx[socks]>=0.26"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/httpx_proxyhat"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
